name: Verify CountCheck
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: countcheck_test
          POSTGRES_USER: countcheck
          POSTGRES_PASSWORD: ci-only-disposable
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U countcheck"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_JDBC_URL: jdbc:postgresql://localhost:5432/countcheck_test
      DB_USERNAME: countcheck
      DB_PASSWORD: ci-only-disposable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: code/pom.xml
      - run: ./mvnw -B verify
      - run: node --check src/main/resources/static/js/app.js
      - run: python -m compileall -q ops smoke_test.py lifecycle_test.py package-embarko.py
