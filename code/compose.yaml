services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: countcheck
      POSTGRES_USER: countcheck
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U countcheck"]
      interval: 5s
      retries: 10
volumes:
  postgres-data:
