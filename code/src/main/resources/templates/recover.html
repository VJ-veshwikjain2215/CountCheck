<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('Account recovery')}"></head>
  <body class="public">
    <main class="prose">
      <a class="brand" href="/">CountCheck.</a>
      <h1>Find your way back.</h1>
      <p>
        Use the private recovery code you saved when you created your workspace.
        A successful recovery signs out existing sessions and replaces your
        recovery code.
      </p>
      <p class="alert" th:if="${error}" th:text="${error}"></p>
      <form th:action="@{/recover}" method="post">
        <label for="email">Account email</label
        ><input id="email" name="email" type="email" required /><label
          for="code"
          >Recovery code</label
        ><input id="code" name="code" autocomplete="off" required /><label
          for="password"
          >New password</label
        ><input
          id="password"
          name="password"
          type="password"
          minlength="12"
          autocomplete="new-password"
          required
        /><button class="button full">Recover account</button>
      </form>
    </main>
  </body>
</html>
