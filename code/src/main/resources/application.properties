spring.application.name=CountCheck
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/countcheck}
spring.datasource.username=${DB_USERNAME:countcheck}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.data-source-properties.socketTimeout=10
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.enabled=false
server.tomcat.max-http-form-post-size=16KB
server.forward-headers-strategy=none

# Release idle database connections so Neon can suspend when the app is idle.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0
# Compress only public assets; keep authenticated HTML outside compression.
server.compression.enabled=true
server.compression.mime-types=text/css,application/javascript,text/javascript
server.compression.min-response-size=1KB
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

spring.mvc.async.request-timeout=30s
